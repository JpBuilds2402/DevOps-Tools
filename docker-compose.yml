services:
  frontend:
    build: ./frontend
    container_name: catalogo_frontend
    ports:
      - "3000:3000"
    networks:
      - catalogo_network
    depends_on:
      - api

  api:
    build: ./api
    container_name: catalogo_api
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=senha123
      - DB_NAME=catalogo
    networks:
      - catalogo_network
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: catalogo_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=senha123
      - POSTGRES_DB=catalogo
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - catalogo_network

volumes:
  db_data:

networks:
  catalogo_network:
    driver: bridge